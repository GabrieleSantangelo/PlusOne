[package]
name = "plus-one-link-android"
version = "0.1.0"
description = "The link's core in Plus One's app: JNI for LinkCore.kt"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "plusonelink"
crate-type = ["cdylib"]

[dependencies]
plus-one-link = { path = "../core" }
jni = "0.21"
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde_json = "1"
