name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the older run of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build test container (its packages cached between runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.ci
          tags: plus-one-ci
          load: true
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: The link's program, for the package
        run: tools/link-docker.sh fetch && tools/link-docker.sh build --release -p plus-one-link-daemon
      - name: Tests, package build and lintian
        run: |
          mkdir -p dist
          docker run --rm -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -v "$PWD/dist:/src/dist" \
            -v "$PWD/link/target/release/plus-one-link:/src/link/target/release/plus-one-link:ro" plus-one-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3  # v6.8
        with:
          bundle: plus-one.flatpak
          manifest-path: packaging/flatpak/io.github.gabrielesantangelo.PlusOne.yml
          build-dir: flatpak_app
          # Poppler and the wheels only rebuild when the manifest changes.
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
      # flatpak build, not flatpak-builder --run: that needs rofiles-fuse,
      # which a container cannot spawn.
      - name: Plus One starts in the Flatpak (GStreamer, libadwaita, Poppler there)
        run: |
          flatpak build flatpak_app plus-one --help
          flatpak build flatpak_app env PYTHONPATH=/app/lib/plus-one python3 -P -c \
            "import plusone.app, plusone.engine, plusone.devices, plusone.rtc, plusone.sign, plusone.signing, plusone.appdisplay"
      - name: The GStreamer elements Plus One builds its pipelines from
        run: |
          flatpak build flatpak_app python3 -c '
          import sys, gi
          gi.require_version("Gst", "1.0")
          from gi.repository import Gst
          Gst.init(None)
          need = ("webrtcbin nicesrc rtph264depay h264parse avdec_h264 opusdec pipewiresink v4l2sink "
                  "videoconvert videoscale videorate x264enc mpegtsmux rtpmp2tpay").split()
          missing = [e for e in need if not Gst.ElementFactory.find(e)]
          sys.exit(f"missing: {missing}" if missing else 0)'

  link:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: The link's crates (Cargo.lock's)
        run: tools/link-docker.sh fetch
      - name: Its tests, with no network
        run: tools/link-docker.sh test
      - name: plusone_link against plus-one-link and a test tablet
        run: |
          tools/link-docker.sh build --release --workspace --examples --bins
          sudo apt-get install -y --no-install-recommends python3-pytest
          PLUSONE_LINK_BIN=link/target/release python3 -m pytest -q -p no:cacheprovider tests/test_plusone_link.py

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build container (the Android SDK cached between runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.android
          tags: plus-one-android
          load: true
          cache-from: type=gha,scope=android
          cache-to: type=gha,mode=max,scope=android
      - name: Build the link's container (the NDK and Rust cached between runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.link-android
          tags: plus-one-link-android
          load: true
          cache-from: type=gha,scope=link-android
          cache-to: type=gha,mode=max,scope=link-android
      - name: The link's core for the app (link/android, into jniLibs)
        run: tools/link-docker.sh fetch && tools/link-docker.sh android
        env:
          PLUSONE_IMAGE_BUILT: "1"
      - name: Gradle's downloads, cached between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/gradle
          key: gradle-${{ hashFiles('android/**/*.kts', 'android/gradle/**', 'Dockerfile.android') }}
          restore-keys: gradle-
      - name: Companion app, in the same container as locally (lint errors and its tests fail it)
        run: tools/android-docker.sh lint testDebugUnitTest assembleDebug
        env:
          PLUSONE_IMAGE_BUILT: "1"
          PLUSONE_GRADLE_CACHE: ${{ runner.temp }}/gradle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
